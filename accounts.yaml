# 계정별 프로파일 설정
# .env의 공통 설정을 기반으로 아래 값들만 덮어씌운다
#
# 실행:
#   poetry run python main.py --profile kr
#   poetry run python main.py --profile jp
#   poetry run python main.py --profile us
#   poetry run python main.py --list-profiles

profiles:

  kr:
    # ---- 계정 ----
    instagram_username: trendboardmvp004@gmail.com
    instagram_password: trendboardmvp@1

    # ---- 지역 설정 ----
    locale: ko-KR
    timezone: Asia/Seoul

    # ---- 스크래핑 대상 ----
    hashtag: ""

    # ---- 프록시 (한국 IP 필요 시) ----
    proxy: ""

    # ---- 출력 ----
    output_dir: output/kr
    request_delay: 2.0

  jp:
    # ---- 계정 ----
    instagram_username: 98inya@gmail.com
    instagram_password: 1q2w3e4r!!!

    # ---- 지역 설정 ----
    locale: ja-JP
    timezone: Asia/Tokyo

    # ---- 스크래핑 대상 ----
    hashtag: ""

    # ---- 프록시 (일본 IP, VPN 사용 시 빈 값) ----
    proxy: ""

    # ---- 출력 ----
    output_dir: output/jp
    request_delay: 2.0

  us:
    # ---- 계정 (미국 인스타그램 계정 — TODO: 실계정 입력 필요) ----
    instagram_username: YOUR_US_INSTAGRAM_ACCOUNT
    instagram_password: YOUR_US_INSTAGRAM_PASSWORD

    # ---- 지역 설정 ----
    locale: en-US
    timezone: America/New_York

    # ---- 스크래핑 대상 ----
    hashtag: ""

    # ---- 프록시 (NordVPN US exit node 사용 시 빈 값) ----
    proxy: ""

    # ---- 출력 ----
    output_dir: output/us
    request_delay: 2.0
